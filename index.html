
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Something for You</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Opening Screen -->
    <section class="opening-screen" id="openingScreen">

        <div class="flower">✿</div>

        <h1>Hey, you.</h1>

        <p>I made something for you.</p>

        <div class="continue-text">
            CLICK ANYWHERE TO CONTINUE
        </div>

    </section>


    <!-- Birthday Screen -->
    <section class="birthday-screen" id="birthdayScreen">

        <div class="birthday-content">

            <div class="flower">✿</div>

            <h1>Happy Birthday!</h1>

            <p>I hope your day is as lovely as you are.</p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
